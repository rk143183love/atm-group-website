<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATM GROUPS — Content Editor</title><style>body{font:14px Arial;margin:0;background:#07131d;color:#fff}main{max-width:1000px;margin:auto;padding:35px 20px}h1{font-size:32px}p{color:#b7c8d1}textarea{width:100%;height:650px;background:#0e2737;color:#e8f2f7;border:1px solid #315161;border-radius:10px;padding:18px;font:13px monospace;box-sizing:border-box}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,a{padding:12px 16px;border-radius:7px;border:0;font-weight:700;cursor:pointer;text-decoration:none}button{background:#f28b18;color:#111}a{background:#fff;color:#07131d}</style></head><body><main><h1>ATM GROUPS — Content Editor</h1><p>Edit business content, services, clients and divisions here. For a permanent website update on GitHub, copy the generated file into <b>content.js</b> and commit it. This page does not store GitHub credentials in the browser.</p><div class="bar"><button id="format">Format JSON</button><button id="download">Download content.js</button><a href="index.html">View Website ↗</a></div><textarea id="box"></textarea><script src="content.js"></script><script>const box=document.getElementById('box');box.value=JSON.stringify(window.ATM_CONTENT,null,2);document.getElementById('format').onclick=()=>{try{box.value=JSON.stringify(JSON.parse(box.value),null,2)}catch(e){alert('Invalid JSON')}};document.getElementById('download').onclick=()=>{try{const obj=JSON.parse(box.value);const text='window.ATM_CONTENT = '+JSON.stringify(obj,null,2)+';\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));a.download='content.js';a.click()}catch(e){alert('Invalid JSON')}};</script></main></body></html>
